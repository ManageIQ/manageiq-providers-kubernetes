---
:ems:
  :ems_kubernetes:
    :miq_namespace: management-infra
    :image_inspector_registry: docker.io
    :image_inspector_repository: openshift/image-inspector
    :image_inspector_cve_url:
    :blacklisted_event_names:
    # Node health affirmations fired continuously when a node is healthy.
    - NODE_NODEHASSUFFICIENTMEMORY
    - NODE_NODEHASNODISKPRESSURE
    - NODE_NODEHASSUFFICIENTPID
    # Image pull lifecycle; not in any event_group and not actionable.
    - POD_PULLING
    - POD_PULLED
    # Scaling churn from HPA loops; not in any event_group.
    - REPLICASET_SCALINGREPLICASET
    - REPLICATOR_SCALINGREPLICASET
    - DEPLOYMENT_SCALINGREPLICASET
    # Routine volume lifecycle confirmations; fire on every pod attach/mount.
    - POD_SUCCESSFULATTACHVOLUME
    - POD_SUCCESSFULMOUNTVOLUME
    # Kubelet startup; fires once per kubelet restart, not actionable.
    - NODE_STARTING
    :event_handling:
      :event_groups:
        :addition:
          :critical:
            - CONTAINER_CREATED
            - REPLICATOR_SUCCESSFULCREATE
            - REPLICATOR_FAILEDCREATE
        :status:
          :critical:
            - NODE_NODEREADY
            - NODE_NODENOTREADY
            - POD_FAILEDVALIDATION
            - POD_DEADLINEEXCEEDED
            - POD_INSUFFICIENTFREECPU
            - POD_NODESELECTORMISMATCHING
            - POD_SCHEDULED
            - POD_FAILEDSCHEDULING
            - CONTAINER_UNHEALTHY
            - CONTAINER_KILLING
            - CONTAINER_STARTED
            - CONTAINER_STOPPED
        :power:
          :critical:
            - NODE_REBOOTED
            - NODE_NODESCHEDULABLE
            - NODE_NODENOTSCHEDULABLE
        :storage:
          :critical:
            - NODE_FAILEDMOUNT
            - NODE_INVALIDDISKCAPACITY
            - POD_OUTOFDISK
            - POD_INSUFFICIENTFREEMEMORY
        :network:
          :critical:
            - POD_HOSTPORTCONFLICT
    :open_timeout: 60.seconds
    :read_timeout: 60.seconds
:http_proxy:
  :kubernetes:
    :host:
    :password:
    :port:
    :user:
:ems_refresh:
  :kubernetes:
    :refresh_interval: 15.minutes
    :streaming_refresh: true
    :chunk_size: 1_000
    :inventory_collections:
      :saver_strategy: batch
:workers:
  :worker_base:
    :event_catcher:
      :event_catcher_kubernetes:
        :poll: 1.seconds
      :event_catcher_prometheus:
        :poll: 20.seconds
    :queue_worker_base:
        :ems_metrics_collector_worker:
          :ems_metrics_collector_worker_kubernetes:
            :metrics_port: 5000
            :metrics_path: "/hawkular/metrics"
            :prometheus_open_timeout: 5
            :prometheus_request_timeout: 30
            :hawkular_force_legacy: true
        :ems_refresh_worker:
          :ems_refresh_worker_kubernetes: {}
